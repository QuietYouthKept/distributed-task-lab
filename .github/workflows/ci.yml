name: CI

on:
  push:
    branches: [main, codex/production-readiness-p0-p1]
  pull_request:

permissions:
  contents: read

env:
  GO_PACKAGES: ./cmd/... ./internal/... ./pkg/...

jobs:
  quality:
    name: Format, vet, unit, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l cmd internal pkg)"
      - name: Vet
        run: go vet $GO_PACKAGES
      - name: Unit and local-safe tests
        run: go test $GO_PACKAGES -count=1 -coverprofile=coverage.out
      - name: Replay and bounded soak runner tests
        run: python3 -B -m unittest discover -s scripts/replay -p 'test_*.py' -v
      - name: Stable v1 OpenAPI contract
        run: go test ./internal/api -run '^TestOpenAPI' -count=1
      - name: Build
        run: go build $GO_PACKAGES
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage
          path: coverage.out

  postgres-integration:
    name: PostgreSQL integration (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify PostgreSQL test evidence gate
        run: python3 -B scripts/alicloud/test_summarize_go_test.py -v
      - name: Run bounded PostgreSQL scheduler benchmark
        shell: bash
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          set -uo pipefail
          run_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          output="${RUNNER_TEMP}/tasklab-loadgen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$output"
          bundle="$output/$run_id"
          printf '%s\n' \
            'go run ./cmd/loadgen' \
            'LOADGEN_TASKS=500' \
            'LOADGEN_PRODUCERS=4' \
            'LOADGEN_WORKERS=4' \
            'LOADGEN_CONCURRENCY=2' \
            'LOADGEN_QUEUES=4' \
            'LOADGEN_PAYLOAD_SIZE=128' \
            'LOADGEN_PROFILE=backlog-drain' \
            'LOADGEN_TASK_TYPE=noop' \
            'LOADGEN_SEED=20261012' > "$output/command.txt"
          echo "LOADGEN_OUTPUT_DIR=$output" >> "$GITHUB_ENV"
          echo "LOADGEN_RUN_ID=$run_id" >> "$GITHUB_ENV"
          set +e
          timeout 180s env \
            LOADGEN_TASKS=500 \
            LOADGEN_PRODUCERS=4 \
            LOADGEN_WORKERS=4 \
            LOADGEN_CONCURRENCY=2 \
            LOADGEN_QUEUES=4 \
            LOADGEN_PAYLOAD_SIZE=128 \
            LOADGEN_PROFILE=backlog-drain \
            LOADGEN_TASK_TYPE=noop \
            LOADGEN_SEED=20261012 \
            LOADGEN_RUN_ID="$run_id" \
            LOADGEN_OUTPUT_DIR="$output" \
            go run ./cmd/loadgen 2>&1 | tee "$output/benchmark.log"
          benchmark_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$benchmark_rc" > "$bundle/exit-code.txt"
          mv "$output/command.txt" "$bundle/command.txt"
          if [[ -f "$output/benchmark.log" ]]; then
            cp "$output/benchmark.log" "$bundle/benchmark.log"
            rm "$output/benchmark.log"
          fi
          (
            cd "$bundle"
            files=()
            for file in benchmark.log command.txt exit-code.txt manifest.json postgres-stats.json raw.csv report.md summary.json; do
              [[ ! -f "$file" ]] || files+=("$file")
            done
            if ((${#files[@]} > 0)); then
              sha256sum "${files[@]}" > SHA256SUMS
            fi
          )
          test "$benchmark_rc" -eq 0
      - name: Preserve bounded scheduler benchmark evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scheduler-benchmark-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tasklab-loadgen-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Verify Worker direct-SQL fencing bypass is blocked
        shell: bash
        run: |
          set -euo pipefail
          evidence=artifacts/worker-fencing-enforcement
          mkdir -p "$evidence"
          result=1
          finish_evidence() {
            printf '%s\n' "$GITHUB_SHA" > "$evidence/source-commit.txt"
            git rev-parse 'HEAD^{tree}' > "$evidence/source-tree.txt"
            printf '%s\n' "$GITHUB_RUN_ID" > "$evidence/workflow-run-id.txt"
            printf '%s\n' "$result" > "$evidence/exit-code.txt"
            (cd "$evidence" && sha256sum command.txt direct-update-exit-code.txt postgres-image.txt postgres-version.txt reproduction.log row-after-attempt.txt source-commit.txt source-tree.txt workflow-run-id.txt exit-code.txt > SHA256SUMS 2>/dev/null || true)
          }
          trap finish_evidence EXIT
          worker_password="$(openssl rand -hex 32)"
          worker_id="ci-fencing-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "::add-mask::$worker_password"
          printf '%s\n' \
            'Apply migrations and deployments/local-first/postgres/runtime-grants.sql to the isolated PostgreSQL service.' \
            'Connect as tasklab_worker_a, a per-Worker LOGIN member of tasklab_worker.' \
            "UPDATE tasks SET status='success', finished_at=clock_timestamp(), leased_by=NULL, lease_expires_at=NULL, lease_version=lease_version+100 WHERE id='<run-scoped-task-id>';" \
            'Expected proof is permission denied; the task remains running with its original worker and lease version.' > "$evidence/command.txt"
          printf '%s\n' 'postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea' > "$evidence/postgres-image.txt"
          PGPASSWORD=postgres psql "$TEST_DATABASE_URL" --no-psqlrc --tuples-only --no-align --command='SHOW server_version' > "$evidence/postgres-version.txt"
          fence_id="ci-fencing-bypass-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export TASKLAB_WORKER_ID="$worker_id"
          export TASKLAB_WORKER_REPRO_PASSWORD="$worker_password"
          PGPASSWORD=postgres psql "$TEST_DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --set=fence_id="$fence_id" --set=worker_id="$worker_id" <<'SQL'
          \getenv worker_password TASKLAB_WORKER_REPRO_PASSWORD
          CREATE ROLE tasklab_migrator NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE ROLE tasklab_api NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE ROLE tasklab_worker NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          GRANT USAGE ON SCHEMA public TO tasklab_api, tasklab_worker;
          SELECT format('CREATE ROLE tasklab_worker_a LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L', :'worker_password') \gexec
          GRANT tasklab_worker TO tasklab_worker_a;
          \i deployments/local-first/postgres/runtime-grants.sql
          INSERT INTO tasks (id, type, queue, payload, status, attempt, leased_by, lease_expires_at, lease_version, started_at)
          VALUES (:'fence_id', 'rag_ingestion', 'default', '{}'::jsonb, 'running', 1, 'legitimate-worker', clock_timestamp() + interval '1 hour', 1, clock_timestamp());
          SQL
          set +e
          PGPASSWORD="$worker_password" PGHOST=127.0.0.1 PGPORT=5432 PGDATABASE=postgres PGUSER=tasklab_worker_a \
            psql --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 --set=fence_id="$fence_id" > "$evidence/reproduction.log" 2>&1 <<'SQL'
          BEGIN;
          UPDATE tasks
             SET status='success', result='{"summary":"unfenced direct SQL"}'::jsonb,
                 finished_at=clock_timestamp(), updated_at=clock_timestamp(),
                 leased_by=NULL, lease_expires_at=NULL, lease_version=lease_version+100
           WHERE id=:'fence_id';
          ROLLBACK;
          SQL
          attack_rc=$?
          set -e
          printf '%s\n' "$attack_rc" > "$evidence/direct-update-exit-code.txt"
          test "$attack_rc" -ne 0
          grep -F 'permission denied for table tasks' "$evidence/reproduction.log"
          PGPASSWORD=postgres psql "$TEST_DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --set=fence_id="$fence_id" --tuples-only --no-align > "$evidence/row-after-attempt.txt" <<'SQL'
          SELECT status || '|' || lease_version::text || '|' || COALESCE(leased_by, '')
            FROM tasks WHERE id=:'fence_id';
          SQL
          grep -F 'running|1|legitimate-worker' "$evidence/row-after-attempt.txt"
          PGPASSWORD=postgres psql "$TEST_DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --set=fence_id="$fence_id" >/dev/null <<'SQL'
          DELETE FROM tasks WHERE id=:'fence_id';
          SQL
          result=0
      - name: Preserve Worker fencing-bypass reproduction evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: worker-fencing-enforcement-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/worker-fencing-enforcement/
          if-no-files-found: warn
          retention-days: 90
      - name: Prepare PostgreSQL acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/postgres-integration
          git rev-parse HEAD > artifacts/postgres-integration/source-commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/postgres-integration/source-tree.txt
          printf '%s\n' "$GITHUB_RUN_ID" > artifacts/postgres-integration/workflow-run-id.txt
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > artifacts/postgres-integration/workflow-run-attempt.txt
          printf '%s\n' "$(uname -a)" > artifacts/postgres-integration/runner-os.txt
          go version > artifacts/postgres-integration/go-version.txt
          printf '%s\n' 'postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea' > artifacts/postgres-integration/postgres-image.txt
          printf '%s\n' "go test -json -p 2 -parallel 2 -count=1 -timeout=18m ./internal/storage/postgres -skip '^TestDatabaseBackupRestoreDrill$'" > artifacts/postgres-integration/test-command.txt
          printf '%s\n' 'Migration version 12 is asserted by TestMigrationsFreshAndRerun.' > artifacts/postgres-integration/migration-assertion.txt
          if PGPASSWORD=postgres psql "$TEST_DATABASE_URL" --no-psqlrc --tuples-only --no-align --command='SHOW server_version' > artifacts/postgres-integration/postgres-version.txt 2> artifacts/postgres-integration/postgres-version.stderr; then
            :
          else
            printf '%s\n' 'NOT_AVAILABLE (see job failure; credentials and DSN suppressed)' > artifacts/postgres-integration/postgres-version.txt
          fi
      - name: Integration and migration suite (unexpected skips fail)
        shell: bash
        run: |
          set -uo pipefail
          evidence=artifacts/postgres-integration
          mkdir -p "$evidence"
          set +e
          go test -json -p 2 -parallel 2 -count=1 -timeout=18m ./internal/storage/postgres \
            -skip '^TestDatabaseBackupRestoreDrill$' > "$evidence/go-test-events.jsonl" 2>&1
          test_rc=$?
          set -e
          printf '%s\n' "$test_rc" > "$evidence/go-test-exit-code.txt"
          set +e
          python3 scripts/alicloud/summarize-go-test.py \
            "$evidence/go-test-events.jsonl" "$evidence/go-test-summary.json" \
            --require-test TestEnqueueAndGetTask \
            --require-test TestConcurrentClaimNoDuplicates \
            --require-test TestRenewLeaseRejectsRealStaleSameWorkerGeneration \
            --require-test TestExpiredRunningReclaimIgnoresCapacity \
            --require-test TestMarkSuccessStaleLeaseVersion \
            --require-test TestRetryBackoff \
            --require-test TestRetryTaskReclaimable \
            --require-test TestDLQNotClaimable \
            --require-test TestEffectLedgerKeepsOldGenerationReceiptAsEvidence \
            --require-test TestEffectReconciliationRequiresIdentityAndWritesAtomicAudit \
            --require-test TestAdministrativeMutationAndAuditAreAtomic \
            --require-test TestRuntimeRoleLeastPrivilege \
            --require-test TestRuntimeRoleLeastPrivilege/alter_schema \
            --require-test TestRuntimeGrantScriptRestrictsWorkerQueueColumns \
            --require-test TestFencedWorkerDatabaseTransitions \
            --require-test TestWorkerCannotRewriteQueueGovernance \
            --require-test TestMigrationsFreshAndRerun \
            --require-test TestSharedIngressLimiterCoordinatesIndependentInstancesAndBoundsState
          summary_rc=$?
          set -e
          (cd "$evidence" && sha256sum source-commit.txt source-tree.txt workflow-run-id.txt workflow-run-attempt.txt runner-os.txt go-version.txt postgres-image.txt test-command.txt migration-assertion.txt postgres-version.txt postgres-version.stderr go-test-events.jsonl go-test-summary.json go-test-exit-code.txt > SHA256SUMS)
          test "$test_rc" -eq 0 && test "$summary_rc" -eq 0
      - name: Preserve PostgreSQL acceptance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: postgres-integration-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/postgres-integration/
          if-no-files-found: warn
          retention-days: 90

  race:
    name: Race detector with PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race $GO_PACKAGES -count=1

  minio-contract:
    name: MinIO contract and worker-process recovery (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build source-pinned MinIO CI image
        run: bash scripts/evidence/build-minio-ci-image.sh
      - name: Start MinIO with ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          image="$MINIO_CI_IMAGE"
          container="tasklab-minio-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          credentials_file="$(mktemp)"
          trap 'rm -f "$credentials_file"' EXIT
          umask 077
          access_key="$(openssl rand -hex 16)"
          secret_key="$(openssl rand -hex 32)"
          echo "::add-mask::$access_key"
          echo "::add-mask::$secret_key"
          printf 'MINIO_ROOT_USER=%s\nMINIO_ROOT_PASSWORD=%s\n' "$access_key" "$secret_key" > "$credentials_file"
          {
            echo "MINIO_CONTAINER_NAME=$container"
            echo "MINIO_ENDPOINT=http://127.0.0.1:9000"
            echo "MINIO_BUCKET=tasklab-ci-contract"
            echo "MINIO_ACCESS_KEY=$access_key"
            echo "MINIO_SECRET_KEY=$secret_key"
            echo 'REQUIRE_MINIO=1'
          } >> "$GITHUB_ENV"
          docker run --detach --name "$container" --env-file "$credentials_file" \
            --publish 127.0.0.1:9000:9000 --publish 127.0.0.1:9001:9001 \
            --tmpfs /data:rw,noexec,nosuid,size=512m "$image" \
            server /data --console-address ':9001'
          rm -f "$credentials_file"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'MinIO failed to become healthy within 60 seconds' >&2
          exit 1
      - name: Run authenticated S3 contract under the race detector
        run: go test -race ./internal/artifacts -run '^TestMinIOStoreContractAndConcurrentConditionalWrite$' -count=1 -v
      - name: Run API and independent Worker process recovery under the race detector
        run: go test -race ./internal/e2e -run '^TestAPITwoWorkersRecoverSharedArtifactAfterAckProcessCrash$' -count=1 -v
      - name: Run isolated PostgreSQL backup/restore drill under the race detector
        env:
          PG_BACKUP_CONTAINER: ${{ job.services.postgres.id }}
          RUN_BACKUP_RESTORE_DRILL: "1"
        run: go test -race ./internal/storage/postgres -run '^TestDatabaseBackupRestoreDrill$' -count=1 -v
      - name: Collect MinIO logs on failure (redacted)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          container="${MINIO_CONTAINER_NAME:-}"
          if [[ -z "$container" ]]; then
            echo 'MinIO container was not started; no container logs available.'
            exit 0
          fi
          if docker container inspect "$container" >/dev/null 2>&1; then
            docker logs "$container" 2>&1 | sed \
              -e "s/${MINIO_ACCESS_KEY:-__NO_ACCESS_KEY__}/[REDACTED]/g" \
              -e "s/${MINIO_SECRET_KEY:-__NO_SECRET_KEY__}/[REDACTED]/g"
          else
            echo 'MinIO container is no longer present; no container logs available.'
          fi
      - name: Remove this job's MinIO container and image
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MINIO_CONTAINER_NAME:-}" ]]; then
            docker rm --force "$MINIO_CONTAINER_NAME" >/dev/null 2>&1 || true
          fi
          if [[ -n "${MINIO_CI_IMAGE:-}" ]]; then
            docker image rm "$MINIO_CI_IMAGE" >/dev/null 2>&1 || true
          fi

  external-client:
    name: Public Go client consumer module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile and exercise the client from a separate module
        working-directory: test/external-client
        run: go test -race ./... -count=1 -v
