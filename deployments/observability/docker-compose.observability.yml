services:
  prometheus:
    image: prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/tasklab-alerts.yml:/etc/prometheus/tasklab-alerts.yml:ro
    depends_on:
      api:
        condition: service_started
      worker-metrics:
        condition: service_healthy
    secrets:
      - api_metrics_token

  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # One explicitly named Worker gives Prometheus a stable target for each
  # process. It is enabled only with the observability profile and is not a
  # production scaling or service-discovery model.
  worker-metrics:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    profiles: [observability]
    environment:
      APP_PROFILE: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tasklab?sslmode=disable
      WORKER_ID: observability-worker
      WORKER_CONCURRENCY: "1"
      WORKER_POLL_INTERVAL: "1s"
      LEASE_TIMEOUT: "90s"
      CLAIM_BATCH_SIZE: "1"
      WORKER_HEALTH_PORT: "9091"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  api_metrics_token:
    environment: API_TOKEN
