global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "tasklab-api"
    authorization:
      type: Bearer
      credentials_file: /run/secrets/api_metrics_token
    static_configs:
      - targets: ["api:8080"]
  - job_name: "tasklab-worker"
    metrics_path: /metrics
    static_configs:
      # Stable single-process development target from the optional overlay.
      - targets: ["worker-metrics:9091"]
