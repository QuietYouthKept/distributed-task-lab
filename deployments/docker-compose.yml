services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasklab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      # context is relative to THIS file (deployments/), so .. is the repo root.
      context: ..
      dockerfile: deployments/Dockerfile.api
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tasklab?sslmode=disable
      API_PORT: "8080"
      API_TOKEN: ${API_TOKEN:?set API_TOKEN to a deployment secret}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN to a distinct deployment secret}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tasklab?sslmode=disable
      WORKER_CONCURRENCY: "4"
      WORKER_POLL_INTERVAL: "1s"
      LEASE_TIMEOUT: "90s"
      CLAIM_BATCH_SIZE: "5"
      WORKER_HEALTH_PORT: "9091"
    volumes:
      - worker_artifacts:/app/artifacts/index
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      replicas: 2

volumes:
  pgdata:
  worker_artifacts:
