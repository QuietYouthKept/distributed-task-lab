version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasklab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deployments/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tasklab?sslmode=disable
      API_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deployments/Dockerfile.worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tasklab?sslmode=disable
      WORKER_CONCURRENCY: "4"
      WORKER_POLL_INTERVAL: "1s"
      LEASE_TIMEOUT: "90s"
      CLAIM_BATCH_SIZE: "5"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2

volumes:
  pgdata:
